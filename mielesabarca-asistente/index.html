<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mieles Abarca · Asistente</title>
<link rel="icon" href="logo.png" type="image/png">
<meta name="theme-color" content="#075e54">
<style>
  :root {
    --verde: #075e54; --verde2: #128c7e; --salida: #d9fdd3; --entrada: #ffffff;
    --fondo: #efeae2; --tinta: #111b21; --gris: #667781; --miel: #c98a12;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--tinta); background: #d7d2c9;
    display: flex; align-items: center; justify-content: center;
  }
  .movil {
    width: 100%; height: 100%; max-width: 460px; max-height: 900px;
    display: flex; flex-direction: column; background: var(--fondo);
    box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden;
  }
  @media (min-width: 520px) and (min-height: 700px) { .movil { height: 94%; border-radius: 22px; } }
  header {
    background: var(--verde); color: #fff; display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  header img { width: 42px; height: 42px; border-radius: 50%; background: #fff; object-fit: cover; }
  header .n { font-weight: 600; font-size: 16.5px; line-height: 1.2; }
  header .s { font-size: 12.5px; opacity: .85; }
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px;
    background-color: var(--fondo);
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px;
  }
  .b {
    max-width: 84%; padding: 7px 10px 8px; border-radius: 10px; font-size: 15px; line-height: 1.38;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.12);
  }
  .b.e { align-self: flex-start; background: var(--entrada); border-top-left-radius: 2px; }
  .b.s { align-self: flex-end; background: var(--salida); border-top-right-radius: 2px; }
  .b a { color: #027eb5; }
  .b .h { display: block; text-align: right; font-size: 11px; color: var(--gris); margin-top: 2px; }
  .aviso {
    align-self: center; background: #fff8dc; color: #54450c; font-size: 12.5px; text-align: center;
    padding: 6px 12px; border-radius: 8px; max-width: 90%; box-shadow: 0 1px 1px rgba(0,0,0,.1);
  }
  .fila { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 96%; }
  .fila.d { align-self: stretch; justify-content: center; }
  .chip, .bt {
    font: inherit; font-size: 14px; border-radius: 18px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--verde2); background: #fff; color: var(--verde);
  }
  .bt.p { background: var(--verde2); color: #fff; text-decoration: none; display: inline-block; }
  .chip:hover, .bt:hover { filter: brightness(.96); }
  .puntos { align-self: flex-start; background: #fff; border-radius: 10px; padding: 12px 14px; display: flex; gap: 5px; }
  .puntos i { width: 7px; height: 7px; border-radius: 50%; background: #9aa5ab; animation: p 1.1s infinite; }
  .puntos i:nth-child(2) { animation-delay: .18s; } .puntos i:nth-child(3) { animation-delay: .36s; }
  @keyframes p { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .puntos i { animation: none; opacity: .6; } }
  form {
    display: flex; gap: 8px; align-items: flex-end; background: #f0f2f5;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  textarea {
    flex: 1; resize: none; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 16px;
    max-height: 110px; outline: none; background: #fff;
  }
  form button {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--verde2); color: #fff;
    cursor: pointer; flex: none; display: grid; place-items: center;
  }
  form button:disabled, textarea:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main class="movil">
  <header>
    <img src="logo.png" alt="Mieles Abarca">
    <div><div class="n">Mieles Abarca</div><div class="s">Asistente virtual · responde al momento</div></div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <textarea id="t" rows="1" placeholder="Escribe un mensaje" maxlength="600" aria-label="Mensaje"></textarea>
    <button id="env" type="submit" aria-label="Enviar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </form>
</main>
<script>
(function () {
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:8797/chat/mielesabarca'
    : 'https://dependiente-demo.ggelcano.workers.dev/chat/mielesabarca';
  var SALUDO = 'Hola, soy el asistente virtual de Mieles Abarca. Te ayudo con nuestras mieles, precios, envíos y regalos. ¿Qué necesitas?';
  var IDEAS = ['¿Qué mieles tenéis?', '¿Cuánto cuesta el envío?', 'Busco un regalo', 'Detalles para una boda'];
  var chat = document.getElementById('chat'), f = document.getElementById('f'), t = document.getElementById('t'), env = document.getElementById('env');
  var historial = [], ocupado = false, pasado = false, filaIdeas = null;

  function hora() { return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
  function abajo() { chat.scrollTop = chat.scrollHeight; }
  function burbuja(texto, clase) {
    var d = document.createElement('div'); d.className = 'b ' + clase;
    String(texto).split(/(https?:\/\/[^\s]+)/g).forEach(function (trozo) {
      if (/^https?:\/\//.test(trozo)) {
        var limpio = trozo.replace(/[.,;:)]+$/, ''), resto = trozo.slice(limpio.length);
        var a = document.createElement('a'); a.href = limpio; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'Ver en la tienda';
        d.appendChild(a); if (resto) d.appendChild(document.createTextNode(resto));
      } else if (trozo) d.appendChild(document.createTextNode(trozo));
    });
    var h = document.createElement('span'); h.className = 'h'; h.textContent = hora(); d.appendChild(h);
    chat.appendChild(d); abajo(); return d;
  }
  function aviso(texto) { var d = document.createElement('div'); d.className = 'aviso'; d.textContent = texto; chat.appendChild(d); abajo(); }
  function fila(clase) { var d = document.createElement('div'); d.className = 'fila' + (clase ? ' ' + clase : ''); chat.appendChild(d); return d; }
  function boton(padre, texto, clase, alPulsar) {
    var b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto;
    b.addEventListener('click', alPulsar); padre.appendChild(b); return b;
  }
  function bloquear(si) { ocupado = si; env.disabled = si || pasado; t.disabled = pasado; }

  function pasarAPersona(telefono) {
    pasado = true; bloquear(false);
    aviso('Conversación pasada a una persona del equipo');
    var d = fila('d');
    if (telefono) {
      var a = document.createElement('a'); a.className = 'bt p'; a.href = 'tel:+34' + String(telefono).replace(/\D/g, '');
      a.textContent = 'Llamar al ' + telefono; d.appendChild(a);
    }
    boton(d, 'Empezar otra conversación', 'bt', function () { location.reload(); });
    abajo();
  }

  function enviar(texto) {
    texto = String(texto || '').trim();
    if (!texto || ocupado || pasado) return;
    if (filaIdeas) { filaIdeas.remove(); filaIdeas = null; }
    Array.prototype.forEach.call(chat.querySelectorAll('.fila.oferta'), function (x) { x.remove(); });
    burbuja(texto, 's'); historial.push({ role: 'user', content: texto });
    t.value = ''; t.style.height = 'auto'; bloquear(true);
    var p = document.createElement('div'); p.className = 'puntos'; p.innerHTML = '<i></i><i></i><i></i>'; chat.appendChild(p); abajo();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: historial }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        p.remove();
        var resp = r.reply || r.error || 'Ahora mismo no puedo contestar. Prueba en un momento.';
        burbuja(resp, 'e'); historial.push({ role: 'assistant', content: resp, e: r.estado || 'R' });
        bloquear(false);
        if (r.humano) return pasarAPersona(r.telefono);
        if (r.ofrecer) {
          var d = fila('oferta');
          boton(d, 'Sí, pásame con una persona', 'bt p', function () { enviar('Sí, pásame con una persona'); });
          boton(d, 'No, sigo por aquí', 'bt', function () { enviar('No, gracias, sigo por aquí'); });
          abajo();
        }
        t.focus();
      })
      .catch(function () { p.remove(); burbuja('No he podido conectar. Prueba otra vez en un momento.', 'e'); bloquear(false); });
  }

  f.addEventListener('submit', function (e) { e.preventDefault(); enviar(t.value); });
  t.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(t.value); } });
  t.addEventListener('input', function () { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 110) + 'px'; });

  aviso('Hoy');
  burbuja(SALUDO, 'e'); historial.push({ role: 'assistant', content: SALUDO, e: 'R' });
  filaIdeas = fila();
  IDEAS.forEach(function (i) { boton(filaIdeas, i, 'chip', function () { enviar(i); }); });
})();
</script>
</body>
</html>
