<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos al proveedor | World Airsoft Tactical | maqueta</title>
<meta name="description" content="Muestra de cómo un encargo llega solo al proveedor y avisa al dueño y al cliente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --negro:#0e0e0e; --rojo:#ff0006; --gris:#5f6166; --linea:#e4e4e4; --wa:#e5ddd5; --yo:#dcf8c6; --verde:#1f8a4c; --ambar:#b26a00; }
* { box-sizing: border-box; }
body { margin:0; background:#f4f4f4; color:#141414; font:15px/1.45 "Roboto", -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
img { max-width:100%; height:auto; display:block; }
button { font:inherit; cursor:pointer; }
.cinta { background:var(--rojo); color:#fff; text-align:center; padding:6px 12px; font-size:12.5px; }
header { background:#fff; border-bottom:3px solid var(--negro); padding:8px 16px; display:flex; align-items:center; gap:14px; }
header img { width:150px; }
header span { font-weight:700; color:var(--gris); font-size:14px; }
.envoltorio { max-width:1100px; margin:0 auto; padding:14px 16px 60px; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tab { flex:1 1 180px; background:#fff; border:2px solid var(--linea); border-radius:10px; padding:10px 12px; font-weight:700; text-align:left; }
.tab[aria-selected="true"] { border-color:var(--rojo); background:#fff0f0; }
.tab small { display:block; font-weight:400; color:var(--gris); font-size:12.5px; }
.controles { display:flex; gap:8px; align-items:center; margin:14px 0 12px; flex-wrap:wrap; }
.btn-sig { background:var(--rojo); color:#fff; border:0; border-radius:999px; padding:12px 26px; font-weight:700; font-size:17px; }
.btn-sig:disabled { background:#bbb; }
.btn-reset { background:#fff; border:1px solid #c9c9c9; border-radius:999px; padding:10px 16px; }
.contador { color:var(--gris); font-size:13.5px; margin-left:auto; }
.paneles { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start; }
.panel { background:#fff; border-radius:14px; border:1px solid var(--linea); overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.07); }
.cab { display:flex; gap:10px; align-items:center; padding:9px 12px; background:var(--negro); color:#fff; }
.cab .av { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; flex:none; }
.cab b { display:block; font-size:14px; line-height:1.2; }
.cab small { display:block; font-size:11.5px; color:#cfd0d3; }
.p-cliente .av { background:#2a7de1; } .p-prov .av { background:var(--ambar); } .p-dueno .av { background:var(--rojo); }
.cuerpo { padding:12px; min-height:260px; display:flex; flex-direction:column; gap:8px; background:var(--wa); }
.p-prov .cuerpo { background:#f1f3f6; }
.vacio { color:#888; font-size:13px; text-align:center; margin:auto; }
.msg { background:#fff; border-radius:10px; padding:7px 10px 18px; font-size:13.5px; position:relative; max-width:94%; align-self:flex-start; box-shadow:0 1px 1px rgba(0,0,0,.08); animation:entra .3s ease both; }
.msg.yo { background:var(--yo); align-self:flex-end; }
.msg .de { display:block; font-size:11.5px; font-weight:700; color:#d10005; }
.msg.yo .de { color:var(--verde); }
.msg .hora { position:absolute; right:8px; bottom:3px; font-size:10.5px; color:#888; }
.mail { background:#fff; border:1px solid #d9dde3; border-left:4px solid var(--ambar); border-radius:8px; padding:8px 10px; font-size:13px; animation:entra .3s ease both; }
.mail.resp { border-left-color:var(--verde); }
.mail b.asunto { display:block; margin-bottom:3px; }
.mail .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.mail .btns span { border-radius:6px; padding:4px 8px; font-size:12px; font-weight:700; border:1px solid #c9c9c9; background:#fafafa; }
.mail .btns .ok { background:var(--verde); color:#fff; border-color:var(--verde); }
.mail .btns .alt.on { background:#fff6e5; border-color:var(--ambar); outline:3px solid rgba(178,106,0,.35); }
.mail .btns .ok.on { outline:3px solid rgba(31,138,76,.35); }
.web { background:#fff; border:1px solid #d9dde3; border-radius:8px; padding:8px 10px; font-size:13px; animation:entra .3s ease both; }
.web .prod { display:flex; gap:10px; align-items:center; }
.web img { width:60px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--linea); }
.nota { font-size:12px; color:#555; text-align:center; background:rgba(255,255,255,.75); border-radius:8px; padding:4px 8px; align-self:center; animation:entra .3s ease both; }
.aviso { background:#fff6e5; border:1px solid #ffd79a; border-radius:8px; padding:6px 9px; font-size:12.5px; animation:entra .3s ease both; }
@keyframes entra { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (max-width:900px) { .paneles { grid-template-columns:1fr; } .cuerpo { min-height:120px; } header img { width:120px; } }
</style>
</head>
<body>
<div class="cinta">Maqueta de G&amp;G Elcano · clientes, proveedores, cuentas y mensajes de ejemplo</div>
<header><img src="img/logo-world-airsoft-tactical.webp" alt="World Airsoft Tactical" width="300" height="87"><span>Pedidos al proveedor</span></header>

<div class="envoltorio">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="controles">
    <button class="btn-sig" id="btn-sig" type="button">Siguiente</button>
    <button class="btn-reset" id="btn-reset" type="button">Volver a empezar</button>
    <span class="contador" id="contador"></span>
  </div>
  <div class="paneles">
    <div class="panel p-cliente"><div class="cab"><span class="av">C</span><div><b id="c1">Cliente</b><small id="c1s"></small></div></div><div class="cuerpo" id="p-cliente"></div></div>
    <div class="panel p-prov"><div class="cab"><span class="av">P</span><div><b id="c2">Proveedor</b><small id="c2s"></small></div></div><div class="cuerpo" id="p-prov"></div></div>
    <div class="panel p-dueno"><div class="cab"><span class="av">W</span><div><b>Vosotros</b><small>vuestro WhatsApp</small></div></div><div class="cuerpo" id="p-dueno"></div></div>
  </div>
</div>

<script>
(function () {
  var M = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function f(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getDate() + ' de ' + M[d.getMonth()]; }
  var IB1 = 'ES12 3456 7890 1234 5678 9012', IB2 = 'ES98 7654 3210 9876 5432 1098', IB3 = 'ES55 1111 2222 3333 4444 5555';
  var T = 'World Airsoft Tactical';
  function wa(p, de, h, yo, hora) { return { p: p, t: 'wa', de: de, h: h, yo: !!yo, hora: hora || '' }; }
  function mail(p, asunto, h, resp) { return { p: p, t: 'mail', asunto: asunto, h: h, resp: !!resp }; }
  function nota(p, h) { return { p: p, t: 'nota', h: h }; }
  function aviso(p, h) { return { p: p, t: 'aviso', h: h }; }
  function web(p, h) { return { p: p, t: 'web', h: h }; }
  var OK = '<div class="btns"><span class="ok">Confirmo modelo exacto</span><span class="alt">Tengo otra versión</span></div>';

  var E = [
    { nombre: 'Desde la web', sub: 'envío a casa del cliente',
      cab: ['Aitor', 'compra en la web', 'Distribuciones Norte', 'por correo · envía a casa del cliente'],
      pasos: [
        [ web('cliente', '<b>Pedido 4211 · web</b><div class="prod"><img src="img/glock-17-gen-5-gbb.webp" alt=""><div>Glock 17 Gen 5 GBB · negra · 165 €<br>A su casa · contra reembolso</div></div>'),
          wa('dueno', 'Pedidos', '<b>Pedido 4211</b>: Glock 17 Gen 5 negra · Aitor, a su casa. Pedido a <b>Distribuciones Norte</b>.', false, '10:04') ],
        [ mail('prov', 'Pedido 4211 · 1 ud.', '<b>Glock 17 Gen 5 GBB · negra</b> · ref. 2.6457<br>Enviar a: Aitor, Las Palmas<br>Si no tenéis este modelo exacto, no enviéis.' + OK),
          wa('cliente', T, 'Hola Aitor, tu pedido 4211 está en marcha. Te aviso cuando salga.', false, '10:05') ],
        [ mail('prov', 'Re: Pedido 4211', '<div class="btns"><span class="ok on">Confirmo modelo exacto</span></div>118,40 € · ' + IB1, true),
          wa('dueno', 'Pedidos', 'Confirmado. Paga <b>118,40 €</b> a <b>' + IB1 + '</b>, concepto <b>WAT 4211</b>. Contesta <b>pagado</b>.', false, '11:30'),
          wa('dueno', 'Vosotros', 'pagado', true, '11:52'),
          mail('prov', 'Pedido 4211 · pagado', 'Transferencia hecha. Podéis enviar. Contestad con el seguimiento.') ],
        [ mail('prov', 'Re: Pedido 4211', 'Enviado. SEUR <b>SE0000418877</b>', true),
          wa('dueno', 'Pedidos', '<b>4211 enviado</b> a casa de Aitor. SEUR SE0000418877. 7-10 días.', false, '16:11'),
          wa('cliente', T, 'Aitor, tu Glock ya ha salido. Llega entre el <b>' + f(8) + '</b> y el <b>' + f(11) + '</b>. Pagas al mensajero.', false, '16:11') ],
        [ wa('cliente', T, 'Tu pedido 4211 se ha entregado hoy. ¡A disfrutarla!', false, '12:40'),
          wa('dueno', 'Pedidos', '<b>4211 entregado</b>. Cobrado contra reembolso. Cerrado.', false, '12:40') ]
      ] },
    { nombre: 'Por WhatsApp', sub: 'recoge en tienda',
      cab: ['Marta', 'escribe al WhatsApp de la tienda', 'Importaciones Sur', 'por WhatsApp · solo envía a tienda'],
      pasos: [
        [ wa('cliente', 'Marta', 'Hola! Tenéis la HK416 A5 eléctrica? La recojo en tienda', true, '18:21'),
          wa('cliente', T, 'Hola Marta. La pedimos al proveedor, 5-8 días, 511 €, la pagas al recogerla. ¿Te la encargo? Dime tu nombre.', false, '18:21'),
          wa('cliente', 'Marta', 'Sí. Marta Pérez', true, '18:23'),
          wa('cliente', T, 'Hecho, encargo 4212. Te aviso por aquí cuando esté.', false, '18:23') ],
        [ wa('prov', T, '<b>Pedido 4212</b>: HK 416 A5 AEG · ref. 2.6391X · 1 ud. · a la tienda.<br>Si no tenéis este modelo exacto, contestad OTRA VERSIÓN. Si sí, OK y el importe.', true, '18:24'),
          wa('dueno', 'Pedidos', '<b>Encargo 4212</b>: HK 416 A5 · Marta, recoge en tienda. Pedido a <b>Importaciones Sur</b>.', false, '18:24') ],
        [ wa('prov', 'Importaciones Sur', 'OK, 372,00 €. ' + IB2, false, '09:05'),
          wa('dueno', 'Pedidos', 'Confirmado. Paga <b>372,00 €</b> a <b>' + IB2 + '</b>, concepto <b>WAT 4212</b>. Contesta <b>pagado</b>.', false, '09:05'),
          wa('dueno', 'Vosotros', 'pagado', true, '09:40'),
          wa('prov', T, 'Pago hecho. Mandadnos el seguimiento cuando salga.', true, '09:40') ],
        [ wa('prov', 'Importaciones Sur', 'Enviado, ASM 7788001234', false, '15:30'),
          wa('dueno', 'Pedidos', '<b>4212 enviado</b> a la tienda, 5-8 días. Cuando llegue contesta <b>llegó 4212</b>.', false, '15:31'),
          nota('cliente', 'Al cliente no se le avisa hasta que esté en tienda') ],
        [ wa('dueno', 'Vosotros', 'llegó 4212', true, '11:15'),
          wa('dueno', 'Pedidos', 'Avisada Marta. Pendiente de recoger y cobrar: 511 €.', false, '11:15'),
          wa('cliente', T, 'Marta, tu HK 416 A5 ya está en la tienda. Pásate cuando quieras. 511 €, los pagas al recogerla.', false, '11:15'),
          wa('cliente', 'Marta', 'Genial, paso mañana!', true, '11:32') ]
      ] },
    { nombre: 'Por teléfono', sub: 'el proveedor solo tiene otra versión',
      cab: ['Iker', 'llama a la tienda · recoge en tienda', 'Proveedores', 'por correo'],
      pasos: [
        [ nota('cliente', 'Iker llama: quiere una Glock 17 VFC negra, «la Gen 4, no la nueva»'),
          wa('dueno', 'Vosotros', 'encargo glock 17 vfc negra gen 4, iker 6xx xxx x45, recoge en tienda, 185', true, '12:10'),
          wa('dueno', 'Pedidos', 'Apunto <b>encargo 4213</b>: Glock 17 VFC · <b>Gen 4</b> · negra · 185 € · Iker, recoge en tienda. ¿Lo pido?', false, '12:10'),
          wa('dueno', 'Vosotros', 'sí', true, '12:11') ],
        [ mail('prov', 'Pedido 4213 · 1 ud.', '<b>Glock 17 GBB · VFC · Gen 4 · negra</b> · a la tienda.<br>El cliente quiere la <b>Gen 4</b>. Si solo tenéis la Gen 5, no enviéis.' + OK),
          wa('cliente', T, 'Hola Iker, tu encargo 4213 (Glock 17 VFC Gen 4 negra) ya está pedido. Te aviso cuando esté en tienda.', false, '12:12') ],
        [ mail('prov', 'Re: Pedido 4213', '<div class="btns"><span class="alt on">Tengo otra versión</span></div>Solo nos queda la Gen 5, mismo precio.', true),
          aviso('dueno', '⚠️ <b>4213: el proveedor solo tiene la Gen 5.</b> No he aceptado nada.'),
          wa('dueno', 'Pedidos', '¿Qué hago? <b>1</b> Pregunto a Iker si le vale la Gen 5 · <b>2</b> La pido a otro proveedor', false, '13:40'),
          wa('dueno', 'Vosotros', '1', true, '13:48') ],
        [ wa('cliente', T, 'Iker, de la Glock 17 VFC negra solo hay ahora la Gen 5, mismo precio. ¿Te vale o buscamos la Gen 4 en otro proveedor?', false, '13:48'),
          wa('cliente', 'Iker', 'Quiero la Gen 4, no me importa esperar', true, '14:05'),
          wa('dueno', 'Pedidos', 'Iker quiere la <b>Gen 4</b>. La pido a <b>Airsoft Import Levante</b>. ¿Vale?', false, '14:05'),
          wa('dueno', 'Vosotros', 'sí', true, '14:06'),
          mail('prov', 'Pedido 4213 · anulado', 'El cliente quiere la Gen 4. Anulamos.'),
          mail('prov', 'Pedido 4213 · Airsoft Import Levante', '<b>Glock 17 GBB · VFC · Gen 4 · negra</b> · a la tienda.<div class="btns"><span class="ok on">Confirmo modelo exacto</span></div>131,50 € · ' + IB3) ],
        [ wa('dueno', 'Pedidos', 'Confirmado. Paga <b>131,50 €</b> a <b>' + IB3 + '</b>, concepto <b>WAT 4213</b>. Contesta <b>pagado</b>.', false, '14:30'),
          wa('dueno', 'Vosotros', 'pagado', true, '15:02'),
          wa('dueno', 'Pedidos', '<b>4213 enviado</b> a la tienda. Correos Express CX2210098. Contesta <b>llegó 4213</b> cuando esté.', false, '10:20'),
          wa('dueno', 'Vosotros', 'llegó 4213', true, '13:00'),
          wa('cliente', T, 'Iker, tu Glock 17 VFC Gen 4 negra ya está en la tienda, como la pediste. 185 €, los pagas al recogerla.', false, '13:00') ]
      ] }
  ];

  var esc = 0, paso = -1;
  var $ = function (id) { return document.getElementById(id); };
  var P = { cliente: $('p-cliente'), prov: $('p-prov'), dueno: $('p-dueno') };
  var tabs = $('tabs');
  E.forEach(function (e, i) {
    var b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = (i + 1) + '. ' + e.nombre + '<small>' + e.sub + '</small>';
    b.addEventListener('click', function () { cargar(i); });
    tabs.appendChild(b);
  });
  function cargar(i) {
    esc = i; paso = -1; var e = E[i];
    Array.prototype.forEach.call(tabs.children, function (b, j) { b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    $('c1').textContent = e.cab[0]; $('c1s').textContent = e.cab[1]; $('c2').textContent = e.cab[2]; $('c2s').textContent = e.cab[3];
    Object.keys(P).forEach(function (k) { P[k].innerHTML = '<div class="vacio">Pulsa «Siguiente»</div>'; });
    $('btn-sig').disabled = false; $('contador').textContent = 'Paso 0 de ' + e.pasos.length;
  }
  function pinta(m) {
    var c = P[m.p], d = document.createElement('div'); var v = c.querySelector('.vacio'); if (v) v.remove();
    if (m.t === 'wa') { d.className = 'msg' + (m.yo ? ' yo' : ''); d.innerHTML = '<span class="de">' + m.de + '</span>' + m.h + '<span class="hora">' + m.hora + '</span>'; }
    else if (m.t === 'mail') { d.className = 'mail' + (m.resp ? ' resp' : ''); d.innerHTML = '<b class="asunto">' + m.asunto + '</b>' + m.h; }
    else { d.className = m.t; d.innerHTML = m.h; }
    c.appendChild(d);
  }
  $('btn-sig').addEventListener('click', function () {
    var e = E[esc]; if (paso >= e.pasos.length - 1) return;
    paso++; e.pasos[paso].forEach(pinta);
    $('contador').textContent = 'Paso ' + (paso + 1) + ' de ' + e.pasos.length;
    if (paso === e.pasos.length - 1) $('btn-sig').disabled = true;
  });
  $('btn-reset').addEventListener('click', function () { cargar(esc); });
  cargar(0);
})();
</script>
</body>
</html>
